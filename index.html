<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园自习室信息</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <nav class="mb-3">
    <a class="me-3" href="index.html">首页</a>
    <a href="room-list.html">自习室查询</a>
  </nav>

  <header>
    <h1 class="h3">校园自习室信息</h1>
    <p class="text-muted" id="sub-title">数据来源：课程统一数据集（教学演示数据，非真实统计）</p>
  </header>

  <p id="status" class="alert alert-warning"></p>

  <section class="row g-3 mb-4" id="cards"></section>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各图书馆座位使用情况（ECharts柱状图）</h2>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">图书馆座位使用情况（Chart.js折线图）</h2>
      <div class="chart-box"><canvas id="pie-chart"></canvas></div>
    </div>
  </section>

  <section class="row g-3 mt-4">
    <div class="col-12">
      <h2 class="h5">自习室座位三维热力墙（Three.js）</h2>
      <p class="text-muted small" id="heat-info">按住鼠标拖动旋转，滚轮缩放，悬停方块查看详情</p>
      <div id="heat-3d" class="chart-box"></div>
      <p class="small mt-2">
        方块颜色：<span class="badge text-bg-success">空闲较多</span>
        <span class="badge text-bg-warning">一般</span>
        <span class="badge text-bg-danger">紧张</span>
        <span class="badge text-bg-secondary">停用</span>
        ；每列一栋楼（从左到右：楠苑、梓苑、图书馆、理科楼、文科楼），自下而上为楼层。
      </p>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="libs/three.min.js"></script>
  <script src="three-heat.js"></script>
  <script src="app.js"></script>
</body>
</html>
